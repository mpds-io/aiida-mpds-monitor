[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiida-mpds-monitor"
version = "0.11.0"
description = "AiiDA webhook monitor for MPDS workflows"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Anton Domnin", email = "a.v.daomnin@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering"
]
requires-python = ">=3.9"
dependencies = [
    "aiida-core>=2.0",
    "PyYAML",
    "requests",
    "dft_organizer @ git+https://github.com/mpds-io/dft_organizer",
]

[project.optional-dependencies]
dev = [
    "pytest >= 6.0",
    "pytest-cov >= 2.12",
]

[project.urls]
Homepage = "https://github.com/mpds-io/aiida_mpds_monitor"
Repository = "https://github.com/mpds-io/aiida_mpds_monitor"

[tool.setuptools.packages.find]
include = ["aiida_mpds_monitor*"]
exclude = ["openspec*", "node_modules*", "aiida_archives_tmp*"]

[project.scripts]
aiida-mpds-monitor = "aiida_mpds_monitor.daemon:main"
aiida-mpds-submit = "aiida_mpds_monitor.submit:main"
aiida-mpds-stub = "aiida_mpds_monitor.stub_server:main"

[tool.uv.sources]
dft-organizer = { git = "https://github.com/mpds-io/dft_organizer.git" }
